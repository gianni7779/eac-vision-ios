name: Build iPhone IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: xcodebuild -project EACVision.xcodeproj -scheme EACVision -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EACVision.app Payload/
          zip -qry EACVision-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: EACVision-iPhone-unsigned-IPA
          path: EACVision-unsigned.ipa
